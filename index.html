<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>MDM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c1603a">
  <meta name="description" content="Aplikasi Ma'had Daar Al Musthofa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MDM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
    body { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
    #aplikasi { border: 0; width: 100%; height: 100%; display: block; }
    #pembuka {
      position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; z-index: 2;
      font-family: Arial, sans-serif; color: #8a4a2c; transition: opacity .4s;
    }
    #pembuka img { width: 120px; height: auto; }
    #pembuka .titik { width: 34px; height: 34px; border: 3px solid #f0d9cc; border-top-color: #c1603a;
      border-radius: 50%; animation: putar 1s linear infinite; }
    @keyframes putar { to { transform: rotate(360deg); } }
    #offline { display: none; position: fixed; inset: 0; background: #fff; z-index: 3;
      font-family: Arial, sans-serif; text-align: center; padding: 40px 24px; box-sizing: border-box; color: #333; }
    #offline img { width: 90px; margin-top: 40px; }
    #offline button { margin-top: 20px; padding: 12px 28px; border: 0; border-radius: 10px;
      background: #c1603a; color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <div id="pembuka">
    <img src="icons/logo.png" alt="Logo Ma'had Daar Al Musthofa">
    <div class="titik"></div>
    <div>Memuat…</div>
  </div>

  <div id="offline">
    <img src="icons/logo.png" alt="">
    <h2>Tidak ada koneksi internet</h2>
    <p>Aplikasi MDM membutuhkan internet. Periksa koneksi Anda, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>

  <div id="izinNotif" style="display:none;position:fixed;left:16px;right:16px;bottom:24px;z-index:4;background:#fff;border-radius:14px;
       box-shadow:0 4px 18px rgba(0,0,0,.25);padding:16px;font-family:Arial,sans-serif;text-align:center">
    <div style="margin-bottom:10px">Ketuk tombol di bawah untuk mengizinkan notifikasi MDM di HP ini.</div>
    <button id="tombolIzin" style="padding:10px 22px;border:0;border-radius:10px;background:#c1603a;color:#fff;font-size:16px">🔔 Izinkan notifikasi</button>
  </div>

  <div id="kotakBagikan" style="display:none;position:fixed;left:16px;right:16px;bottom:24px;z-index:60;background:#fff;border-radius:14px;
       box-shadow:0 4px 18px rgba(0,0,0,.25);padding:16px;font-family:Arial,sans-serif;text-align:center">
    <div style="margin-bottom:10px">Gambar siap dibagikan.</div>
    <button id="tombolBagikanGambar" style="padding:10px 22px;border:0;border-radius:10px;background:#c1603a;color:#fff;font-size:16px">📤 Bagikan gambar</button>
    <button id="tombolBatalBagikan" style="padding:10px 16px;border:0;border-radius:10px;background:#eee;font-size:16px;margin-left:6px">Batal</button>
  </div>

  <iframe id="aplikasi" title="MDM" allow="clipboard-write; web-share"
          src="https://script.google.com/macros/s/AKfycbwEnv1OC3X4YR0WTin14Cx2yOVhCZMH49UTvy8SSBWKPijsfIRXSxeod0YeTxFbPe8jvw/exec"></iframe>

  <script src="firebase-config.js"></script>
  <script>
    var pembuka = document.getElementById('pembuka');
    function tutupPembuka() { pembuka.style.opacity = 0; setTimeout(function () { pembuka.style.display = 'none'; }, 400); }
    document.getElementById('aplikasi').addEventListener('load', tutupPembuka);
    setTimeout(tutupPembuka, 15000); // jaga-jaga jika event load tidak terpanggil
    function cekKoneksi() { document.getElementById('offline').style.display = navigator.onLine ? 'none' : 'block'; }
    window.addEventListener('online', function () { location.reload(); });
    window.addEventListener('offline', cekKoneksi);
    cekKoneksi();
    // Penyimpanan kunci login untuk sistem di dalam aplikasi (hanya dari Google Apps Script)
    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (x) { return; }
      if (!/\.googleusercontent\.com$/.test(host) || !e.data || !e.data.mdm) return;
      try {
        if (e.data.mdm === 'simpan' && e.data.kunci) localStorage.setItem('mdm_kunci_login', e.data.kunci);
        else if (e.data.mdm === 'hapus') localStorage.removeItem('mdm_kunci_login');
        else if (e.data.mdm === 'minta') e.source.postMessage({ mdm: 'kunci', kunci: localStorage.getItem('mdm_kunci_login') }, e.origin);
        else if (e.data.mdm === 'notifStatus') e.source.postMessage({ mdm: 'notifStatus', didukung: notifDidukung(),
          izin: window.Notification ? Notification.permission : 'denied', token: localStorage.getItem('mdm_fcm_token') }, e.origin);
        else if (e.data.mdm === 'notifAktifkan') aktifkanNotif(e.source, e.origin);
        else if (e.data.mdm === 'notifMatikan') matikanNotif();
        else if (e.data.mdm === 'bagikanGambar') bagikanGambar(e.data.data, e.data.nama, e.source, e.origin);
        else if (e.data.mdm === 'simpanGambar') { simpanGambar(e.data.data, e.data.nama); e.source.postMessage({ mdm: 'simpanHasil', ok: true }, e.origin); }
      } catch (x) {}
    });

    // ---------- Bagikan / simpan gambar rekap ----------
    function keBerkas(dataUrl, nama) {
      var b = atob(dataUrl.split(',')[1]), u = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
      return new File([u], nama || 'rekap.png', { type: 'image/png' });
    }
    function simpanGambar(dataUrl, nama) {
      var a = document.createElement('a'); a.href = dataUrl; a.download = nama || 'rekap.png';
      document.body.appendChild(a); a.click(); a.remove();
    }
    function bagikanGambar(dataUrl, nama, sumber, asal) {
      var berkas = keBerkas(dataUrl, nama);
      if (!(navigator.canShare && navigator.canShare({ files: [berkas] }))) {
        sumber.postMessage({ mdm: 'bagikanHasil', ok: false, alasan: 'HP ini belum mendukung tombol Bagikan. Tekan lama gambar, lalu pilih Bagikan / Simpan.' }, asal);
        return;
      }
      function bagikan() { return navigator.share({ files: [berkas], title: nama }); }
      bagikan().then(function () { sumber.postMessage({ mdm: 'bagikanHasil', ok: true }, asal); }).catch(function (x) {
        if (x && x.name === 'AbortError') { sumber.postMessage({ mdm: 'bagikanHasil', ok: true }, asal); return; }
        // Jika browser meminta ketukan langsung, tampilkan tombol di bingkai aplikasi
        var kotak = document.getElementById('kotakBagikan');
        kotak.style.display = 'block';
        document.getElementById('tombolBagikanGambar').onclick = function () { kotak.style.display = 'none'; bagikan().catch(function () {}); };
        document.getElementById('tombolBatalBagikan').onclick = function () { kotak.style.display = 'none'; };
        sumber.postMessage({ mdm: 'bagikanHasil', ok: true }, asal);
      });
    }

    // ---------- Notifikasi aplikasi (Firebase Cloud Messaging) ----------
    var pesanFcm = null;
    function notifDidukung() {
      return !!(window.MDM_FIREBASE && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window);
    }
    // Pustaka Firebase baru dimuat saat dibutuhkan, agar aplikasi tetap cepat terbuka
    function muatSkrip(src) {
      return new Promise(function (ok, gagal) {
        var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { gagal(new Error('Tidak bisa memuat ' + src)); };
        document.head.appendChild(s);
      });
    }
    function fcm() {
      if (pesanFcm) return Promise.resolve(pesanFcm);
      var v = 'https://www.gstatic.com/firebasejs/10.12.2/';
      return (window.firebase ? Promise.resolve() : muatSkrip(v + 'firebase-app-compat.js').then(function () { return muatSkrip(v + 'firebase-messaging-compat.js'); }))
        .then(function () {
          if (!firebase.apps.length) firebase.initializeApp(MDM_FIREBASE.config);
          pesanFcm = firebase.messaging();
          return pesanFcm;
        });
    }
    function namaPerangkat() {
      var u = navigator.userAgent;
      var hp = /iPhone|iPad/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : 'Komputer';
      var br = /Edg\//.test(u) ? 'Edge' : /SamsungBrowser/.test(u) ? 'Samsung' : /CriOS|Chrome/.test(u) ? 'Chrome' : /Safari/.test(u) ? 'Safari' : 'Browser';
      return hp + ' · ' + br;
    }
    function mintaIzin() {
      return Notification.requestPermission().then(function (p) {
        if (p !== 'default') return p;
        // Jika browser tidak menampilkan pertanyaan izin, tampilkan tombol agar pengguna mengetuknya langsung
        return new Promise(function (selesai) {
          var kotak = document.getElementById('izinNotif');
          kotak.style.display = 'block';
          document.getElementById('tombolIzin').onclick = function () {
            kotak.style.display = 'none';
            Notification.requestPermission().then(selesai);
          };
        });
      });
    }
    function aktifkanNotif(sumber, asal) {
      function gagal(alasan) { sumber.postMessage({ mdm: 'notifGagal', alasan: alasan }, asal); }
      if (!notifDidukung()) { gagal('HP / browser ini belum mendukung notifikasi aplikasi.'); return; }
      mintaIzin().then(function (p) {
        if (p !== 'granted') { gagal('Notifikasi tidak diizinkan. Buka pengaturan situs mdm-mesir.github.io di browser, lalu izinkan Notifikasi.'); return; }
        return Promise.all([navigator.serviceWorker.ready, fcm()]).then(function (h) {
          return h[1].getToken({ vapidKey: MDM_FIREBASE.vapidKey, serviceWorkerRegistration: h[0] });
        }).then(function (t) {
          if (!t) { gagal('Gagal mendaftarkan HP ini. Coba lagi.'); return; }
          localStorage.setItem('mdm_fcm_token', t);
          sumber.postMessage({ mdm: 'notifToken', token: t, ket: namaPerangkat() }, asal);
        });
      }).catch(function (x) { gagal('Gagal mengaktifkan notifikasi: ' + (x && x.message ? x.message : x)); });
    }
    function matikanNotif() {
      localStorage.removeItem('mdm_fcm_token');
      if (notifDidukung()) fcm().then(function (m) { return m.deleteToken(); }).catch(function () {});
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
